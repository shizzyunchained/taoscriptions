name: Bittensor Runtime Compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read

concurrency:
  group: runtime-compatibility
  cancel-in-progress: true

jobs:
  verify-runtime:
    name: Verify mainnet and testnet metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.12.0
          cache: npm
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Verify required calls, storage, events, and runtime specs
        run: npm run verify:runtime

      - name: Construct and round-trip an unsigned live testnet mint
        run: npm run verify:transaction
