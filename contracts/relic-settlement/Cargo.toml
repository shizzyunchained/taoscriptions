[package]
name = "bittensor_relic_settlement"
version = "0.1.0"
authors = ["Bittensor Relics"]
edition = "2021"
publish = false

[dependencies]
ink = { version = "5.1.1", default-features = false }
scale = { package = "parity-scale-codec", version = "=3.6.12", default-features = false, features = ["derive"] }
scale-info = { version = "=2.11.3", default-features = false, features = ["derive"], optional = true }

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
std = ["ink/std", "scale/std", "scale-info/std"]
ink-as-dependency = []

[profile.release]
overflow-checks = false
lto = true
codegen-units = 1

[workspace]
